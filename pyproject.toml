[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "coreason_etl_uspto"
dynamic = ["version"]
description = "ETL process for integrating United States patent and trademark data"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Akshaya M", email = "akshaya.movvar@coreason.ai" },
]
dependencies = [
    "loguru>=0.7.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "dlt[postgres]>=1.0.0",
    "requests>=2.31.0",
    "lxml>=5.1.0",
    "xmltodict>=0.13.0",
    "polars>=0.20.10",
    "adbc-driver-postgresql>=1.10.0",
]
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "pre-commit>=4.5.1",
    "pytest-cov>=7.0.0",
    "zensical",
    "mypy>=1.19.1",
    "pytest-asyncio",
    "pytest-benchmark",
    "deptry",
    "deepdiff",
    "hypothesis",
    "syrupy",
    "mkdocstrings-python",
    "types-pyyaml>=6.0.12.20250915",
    "tzdata>=2025.3",
    "pytest-xdist>=3.6.1",
    "types-requests>=2.32.4.20260107",
    "types-xmltodict>=1.0.1.20260113",
    "lxml-stubs>=0.5.1",
    "pytest-mock>=3.15.1",
    "respx>=0.22.0",
    "requests-mock>=1.12.1",
    "responses>=0.26.0",
    "connectorx>=0.4.5",
    "pyarrow>=23.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coreason_etl_uspto"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
addopts = "-n auto --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=100"
testpaths = ["tests"]
